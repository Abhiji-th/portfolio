services:
  backend:
    build: ./backend
    container_name: portfolio_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://mongodb:27017/portfolio_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    container_name: portfolio_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    container_name: portfolio_db
    ports:
      - "27017:27010"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:latest
    container_name: portfolio_redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
